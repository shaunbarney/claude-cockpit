[package]
name = "claude-cockpit"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "A fast, read-only terminal dashboard for Claude Code — see your background agents, token/USD spend, rate-limit headroom, git worktrees, Docker, dev endpoints, and tool usage at a glance, all from local files with no daemon."
license = "MIT"
repository = "https://github.com/shaunbarney/claude-cockpit"
homepage = "https://github.com/shaunbarney/claude-cockpit"
readme = "README.md"
keywords = ["claude", "tui", "monitoring", "dashboard", "git"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Shaun Barney"]

[[bin]]
name = "claude-cockpit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
comfy-table = { version = "7", features = ["crossterm"] }
ratatui = "0.30"
console = "0.15"
tokei = "14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
nucleo-matcher = "0.3"
toml = "0.8"
yaml-rust2 = { version = "0.10", default-features = false }
serde_ignored = "0.1"

[profile.release]
opt-level = 3
lto = true
